services:
  - type: web
    name: crowdguard-sentinel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CROWDGUARD_AI_PROVIDER
        value: mock
      - key: CROWDGUARD_DB_PATH
        value: /tmp/crowdguard.db
      - key: CROWDGUARD_CORS_ORIGIN_REGEX
        value: ^https://[a-zA-Z0-9-]+\.vercel\.app$
      - key: CROWDGUARD_CORS_ORIGINS
        sync: false
      - key: CROWDGUARD_DEVICE_API_KEY
        sync: false
      - key: CROWDGUARD_DEVICE_ID
        value: crowdguard-sentinel-01
      - key: CROWDGUARD_DEVICE_TRANSPORT
        value: CLOUD_POLL
      - key: CROWDGUARD_DEVICE_STALE_SECONDS
        value: "20"
